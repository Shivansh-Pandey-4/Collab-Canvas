name: Build websocket docker image and Run docker container on VM

on:
  push:
    branches:
      - main
    paths:
      - "apps/ws-server/**"
      - "docker/Dockerfile.websocket"
      - "packages/**"
      - "package.json"
      - "package-lock.json"
      - "turbo.json"
      - ".github/workflows/cd_websocket_prod.yml"

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the branch in github runner
        uses: actions/checkout@v2

      - name: Docker login
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push backend
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./docker/Dockerfile.websocket
          push: true
          tags: ${{secrets.DOCKERHUB_USERNAME}}/websocket:${{github.sha}}
          build-args: |
            DATABASE_URL=${{ secrets.DATABASE_URL }}
            BETTER_AUTH_URL=${{secrets.BETTER_AUTH_URL}}

      - name: SSH into ec2
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.PRIVATE_KEY }}
          port: ${{ secrets.PORT }}
          script: |
            cd ~/collabcanvas

            sudo docker pull ${{secrets.DOCKERHUB_USERNAME}}/websocket:${{github.sha}} && sudo docker rm -f collab-websocket && sudo docker run -p 8080:8080 -d --env-file .env --name collab-websocket ${{secrets.DOCKERHUB_USERNAME}}/websocket:${{github.sha}}

            sudo docker image prune -a -f
