name: Build docker image and deploy to VM

on:
  push:
    branches:
      - main

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the branch in github runner
        uses: actions/checkout@v2

      - name: Docker login
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push backend
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./docker/Dockerfile.backend
          push: true
          tags: ${{secrets.DOCKERHUB_USERNAME}}/backend:${{github.sha}}
          build-args: |
            DATABASE_URL=${{ secrets.DATABASE_URL }}

      - name: Build and push frontend
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./docker/Dockerfile.frontend
          push: true
          tags: ${{secrets.DOCKERHUB_USERNAME}}/frontend:${{github.sha}}
          build-args: |
            DATABASE_URL=${{ secrets.DATABASE_URL }}

      - name: Build and push websocket
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./docker/Dockerfile.websocket
          push: true
          tags: ${{secrets.DOCKERHUB_USERNAME}}/websocket:${{github.sha}}
          build-args: |
            DATABASE_URL=${{ secrets.DATABASE_URL }}

      - name: SSH into ec2
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.PRIVATE_KEY }}
          port: ${{ secrets.PORT }}
          script: |
            whoami
            ls -al
