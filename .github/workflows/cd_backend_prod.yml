name: Build backend docker image and Run docker container on VM

on:
  push:
    branches:
      - main
    paths:
      - "apps/http-server/**"
      - "docker/Dockerfile.backend"
      - "packages/**"
      - "package.json"
      - "package-lock.json"
      - "turbo.json"
      - ".github/workflows/cd_backend_prod.yml"

jobs:
  build_and_deploy_backend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the branch in github runner
        uses: actions/checkout@v2

      - name: Docker login
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push backend
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./docker/Dockerfile.backend
          push: true
          tags: ${{secrets.DOCKERHUB_USERNAME}}/backend:${{github.sha}}
          build-args: |
            DATABASE_URL=${{ secrets.DATABASE_URL }}

      - name: SSH into ec2
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.PRIVATE_KEY }}
          port: ${{ secrets.PORT }}
          script: |
            cd ~/collabcanvas

            sudo docker pull ${{secrets.DOCKERHUB_USERNAME}}/backend:${{github.sha}} && sudo docker rm -f collab-backend && sudo docker run -p 3000:3000 -d --env-file .env --name collab-backend ${{secrets.DOCKERHUB_USERNAME}}/backend:${{github.sha}}
